 <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-3 justify-center">
      📋 Lista de Denúncias
    </h2>

<p-table [value]="denuncias" [tableStyle]="{ 'min-width': '50rem' }">

    <ng-template #header>
        <tr>
            <th>Protocolo</th>
            <th>Imagem</th>
            <th>Cidade</th>
            <th>Estado</th>
        </tr>
    </ng-template>
    <ng-template #body let-denuncia>
        <tr>
          <td>{{ denuncia.protocolo }}</td>
            <td>
                    <img
                        [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + denuncia.imagens[0].url"
                        [alt]="denuncia.name"
                        class="w-24 rounded"
                    />
                </td>
            <td>{{ denuncia.cidade }}</td>
            <td>{{ denuncia.estado }}</td>
        </tr>
    </ng-template>
</p-table>
