<h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-3 justify-center">
    📋 Lista de Denúncias
</h2>
<p-table [value]="denuncias" [tableStyle]="{ 'min-width': '50rem' }">

  <ng-template #header>
        <tr>
            <th>Protocolo</th>
            <th>Imagem</th>
            <th>Cidade</th>
            <th >
                <div class="flex items-center gap-2">
                    Situação
                </div>
            </th>
        </tr>
        <tr>
            <th>
                <p-columnFilter type="text" field="protocolo" placeholder="Type to search" ariaLabel="Filter Name"
                    filterOn="input" [showMenu]="false"></p-columnFilter>

            </th>
            <th></th>
            <th></th>
            <th>
                <p-columnFilter field="status" matchMode="equals" [showMenu]="true">
                    <ng-template #filter let-value let-filter="filterCallback">
                        <p-select [options]="statuses" optionLabel="name" optionValue="value" (onChange)="filter($event.value)" placeholder="Select One" [showClear]="true" style="min-width: 12rem">
                            <ng-template let-option #item>
                                <p-tag [severity]="getSeverity(option.value)" [value]="option.name" />                               
                            </ng-template>
                        </p-select>

                    </ng-template>
                    </p-columnFilter>
            </th>

        </tr>
    </ng-template>
    <ng-template #body let-denuncia>
        <tr>
            <td>{{ denuncia.protocolo }}</td>
            <td>
                <img [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + denuncia.imagens[0].url"
                    [alt]="denuncia.name" class="w-24 rounded" />
            </td>
            <td>{{ denuncia.cidade }}</td>
            <td>
                <p-tag [severity]="getSeverity(denuncia.status)" [value]="denuncia.status" />
            </td>
        </tr>

    </ng-template>
</p-table>
